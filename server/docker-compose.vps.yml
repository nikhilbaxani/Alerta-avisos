# Despliegue en el VPS (desde la raíz del repo):
#   docker compose -f server/docker-compose.vps.yml --env-file server/relay.env up -d --build
# Todo en un solo origen: Tailscale Funnel → web (Caddy, 127.0.0.1:8080) → /relay/* → relay → stt.
# Todos comparten la red por defecto de compose (stt necesita salida para bajar el modelo).
# Solo `web` publica un puerto, y solo en loopback: nada escucha en la IP pública del VPS.
# (Whisper necesita salida a internet solo la primera vez, para descargar el modelo.)
services:
  web:
    build:
      context: ..
      dockerfile: server/Dockerfile.web
      args:
        MAX_CALL_SECONDS: ${MAX_CALL_SECONDS:-120}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080" # WEB_PORT: puerto local del host que publica Funnel
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay

  relay:
    build:
      context: ..
      dockerfile: server/Dockerfile.relay
    restart: unless-stopped
    environment:
      PORT: "8080"
      STT_BASE_URL: http://stt:8000/v1
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      MAX_CALL_SECONDS: ${MAX_CALL_SECONDS:-120}
      RELAY_TOKEN: ${RELAY_TOKEN:?define RELAY_TOKEN en server/relay.env}
      # Origen público de Funnel (https://<nodo>.<tailnet>.ts.net): el navegador envía Origin también en POST del mismo origen.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?define ALLOWED_ORIGINS en server/relay.env}
      RATE_LIMIT: ${RATE_LIMIT:-3}
      RATE_WINDOW_MIN: ${RATE_WINDOW_MIN:-10}
      TRUST_PROXY: "1" # X-Forwarded-For desde la derecha, saltando direcciones locales/privadas (Funnel → Caddy)
      HOST: 0.0.0.0 # solo alcanzable desde la red de compose
    depends_on:
      - stt

  stt:
    build:
      context: ..
      dockerfile: server/Dockerfile.stt
    restart: unless-stopped
    environment:
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      MAX_CALL_SECONDS: ${MAX_CALL_SECONDS:-120} # rechaza (413) audio > máximo + 5 s sin transcribirlo
    volumes:
      - whisper_models:/models

volumes:
  caddy_data:
  caddy_config:
  whisper_models:
