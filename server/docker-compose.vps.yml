# Despliegue en el VPS (desde la raíz del repo):
#   docker compose -f server/docker-compose.vps.yml --env-file server/relay.env up -d --build
# Todo en un solo origen: Tailscale Funnel → web (Caddy, 127.0.0.1:8080) → /relay/* → relay → stt.
# `stt` (Whisper local) está en el perfil `local-stt`: relay.env.example lo activa con COMPOSE_PROFILES=local-stt.
# Si el relay usa el Whisper del sobremesa (STT_BASE_URL del gateway), quita esa línea y no se levanta.
# Todos comparten la red por defecto de compose (stt necesita salida para bajar el modelo).
# Solo `web` publica un puerto, y solo en loopback: nada escucha en la IP pública del VPS.
# (Whisper necesita salida a internet solo la primera vez, para descargar el modelo.)
services:
  web:
    build:
      context: ..
      dockerfile: server/Dockerfile.web
      args:
        MAX_CALL_SECONDS: ${MAX_CALL_SECONDS:-120}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080" # WEB_PORT: puerto local del host que publica Funnel
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay

  relay:
    build:
      context: ..
      dockerfile: server/Dockerfile.relay
    restart: unless-stopped
    environment:
      PORT: "8080"
      STT_BASE_URL: ${STT_BASE_URL:-http://stt:8000/v1}
      # Clave del STT (vacía → la del LLM solo si STT_BASE_URL tiene el mismo origen que LLM_BASE_URL) y tiempo máximo (ms).
      STT_API_KEY: ${STT_API_KEY:-}
      STT_TIMEOUT_MS: ${STT_TIMEOUT_MS:-180000}
      # Reintentos del STT ante 429/502/503/504 o red caída (0 = sin reintentos).
      STT_RETRIES: ${STT_RETRIES:-3}
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      MAX_CALL_SECONDS: ${MAX_CALL_SECONDS:-120}
      RELAY_TOKEN: ${RELAY_TOKEN:?define RELAY_TOKEN en server/relay.env}
      # Origen público de Funnel (https://<nodo>.<tailnet>.ts.net): el navegador envía Origin también en POST del mismo origen.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?define ALLOWED_ORIGINS en server/relay.env}
      RATE_LIMIT: ${RATE_LIMIT:-3}
      RATE_WINDOW_MIN: ${RATE_WINDOW_MIN:-10}
      # Audios aceptados por IP y ventana, sin devolución al descartar. Vacío → 3 × RATE_LIMIT.
      UPLOAD_LIMIT: ${UPLOAD_LIMIT:-}
      # Llamadas de una misma IP esperando «Enviar».
      PENDING_PER_IP: ${PENDING_PER_IP:-2}
      # Llamadas retenidas sin enviar en todo el relay (50 personas a la vez: MAX_PENDING=50).
      MAX_PENDING: ${MAX_PENDING:-20}
      # Segundos que una llamada ya transcrita espera a «Enviar» antes de caducar.
      PENDING_TTL_SECONDS: ${PENDING_TTL_SECONDS:-300}
      TRUST_PROXY: "1" # X-Forwarded-For desde la derecha, saltando direcciones locales/privadas (Funnel → Caddy)
      HOST: 0.0.0.0 # solo alcanzable desde la red de compose
      # LLM opcional del equipo (vacío → solo reglas). La clave vive solo en server/relay.env.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
      # Peticiones simultáneas del relay al LLM (el gateway admite pocas conexiones por IP).
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-2}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
    depends_on:
      stt:
        condition: service_started
        required: false # sin el perfil local-stt no existe: el relay usa el STT de STT_BASE_URL

  stt:
    profiles: ["local-stt"]
    build:
      context: ..
      dockerfile: server/Dockerfile.stt
    restart: unless-stopped
    environment:
      STT_MODEL: ${STT_LOCAL_MODEL:-${STT_MODEL:-Systran/faster-whisper-small}}
      MAX_CALL_SECONDS: ${MAX_CALL_SECONDS:-120} # rechaza (413) audio > máximo + 5 s sin transcribirlo
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-5}
      STT_CPU_THREADS: ${STT_CPU_THREADS:-0}
    volumes:
      - whisper_models:/models

volumes:
  caddy_data:
  caddy_config:
  whisper_models:

networks:
  default:
    driver_opts:
      # Nombre fijo del puente: server/tailnet-guard.nft bloquea por él el acceso de estos contenedores a la tailnet.
      com.docker.network.bridge.name: br-alerta
