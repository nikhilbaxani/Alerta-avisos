<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Símbolo: llamadas que convergen en un incidente">
  <g transform="translate(0 0) scale(1)">
    <!-- llamadas que convergen -->
    <circle cx="6" cy="14" r="3.2" fill="#15222E" opacity="0.45"/>
    <circle cx="4" cy="32" r="3.2" fill="#15222E" opacity="0.7"/>
    <circle cx="6" cy="50" r="3.2" fill="#15222E" opacity="0.45"/>
    <path d="M10 16 L22 25 M9 32 L20 32 M10 48 L22 39" stroke="#15222E" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
    <!-- el incidente: un solo anillo -->
    <circle cx="38" cy="32" r="16" fill="none" stroke="#15222E" stroke-width="6"/>
    <!-- arco ambar: decide el operador -->
    <path d="M38 16 A16 16 0 0 1 54 32" fill="none" stroke="#F2A900" stroke-width="6" stroke-linecap="butt"/>
    <circle cx="38" cy="32" r="4.5" fill="#C61F2B"/>
  </g>
</svg>
