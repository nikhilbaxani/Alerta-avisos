<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
  <title>Hoja de ruta del Agente 112</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#15222E"/>
    </marker>
  </defs>
  <rect width="1100" height="330" fill="#E9EDF0"/>

  <line x1="20" y1="50" x2="1078" y2="50" stroke="#15222E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hoy -->
  <rect x="20" y="28" width="245" height="44" rx="22" fill="#15222E"/>
  <text x="142.5" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">✓ Hoy · MVP</text>
  <text x="28" y="105" font-size="14" fill="#15222E">• Consola completa en modo</text>
  <text x="40" y="126" font-size="14" fill="#15222E">simulado, sin red ni GPU</text>
  <text x="28" y="156" font-size="14" fill="#15222E">• IA local probada en una</text>
  <text x="40" y="177" font-size="14" fill="#15222E">GPU de portátil de 8 GB</text>
  <text x="28" y="207" font-size="14" fill="#15222E">• Dos escenarios en Málaga:</text>
  <text x="40" y="228" font-size="14" fill="#15222E">DANA y apagón</text>

  <!-- Piloto -->
  <rect x="285" y="28" width="245" height="44" rx="22" fill="#F2A900" stroke="#15222E" stroke-width="2"/>
  <text x="407.5" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#15222E">Piloto</text>
  <text x="293" y="105" font-size="14" fill="#15222E">• Con un contratista que</text>
  <text x="305" y="126" font-size="14" fill="#15222E">opera una sala del 112</text>
  <text x="293" y="156" font-size="14" fill="#15222E">• Llamadas reales</text>
  <text x="305" y="177" font-size="14" fill="#15222E">anonimizadas</text>
  <text x="293" y="207" font-size="14" fill="#15222E">• Medir líneas liberadas y</text>
  <text x="305" y="228" font-size="14" fill="#15222E">tiempo hasta la llamada</text>
  <text x="305" y="249" font-size="14" fill="#15222E">crítica, con operadores</text>

  <!-- Integración -->
  <rect x="550" y="28" width="245" height="44" rx="22" fill="#FFFFFF" stroke="#15222E" stroke-width="2"/>
  <text x="672.5" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#15222E">Integración</text>
  <text x="558" y="105" font-size="14" fill="#15222E">• Conexión con la plataforma</text>
  <text x="570" y="126" font-size="14" fill="#15222E">de la sala (CAD)</text>
  <text x="558" y="156" font-size="14" fill="#15222E">• Telefonía real y audio</text>
  <text x="570" y="177" font-size="14" fill="#15222E">en directo</text>
  <text x="558" y="207" font-size="14" fill="#15222E">• Servidor con GPU dentro</text>
  <text x="570" y="228" font-size="14" fill="#15222E">de la propia sala</text>

  <!-- Ley de IA -->
  <rect x="815" y="28" width="245" height="44" rx="22" fill="#FFFFFF" stroke="#15222E" stroke-width="2"/>
  <text x="937.5" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#15222E">Ley de IA europea</text>
  <text x="823" y="105" font-size="14" fill="#15222E">• Alto riesgo: obligaciones</text>
  <text x="835" y="126" font-size="14" fill="#15222E">desde diciembre de 2027</text>
  <text x="823" y="156" font-size="14" fill="#15222E">• Humano en el bucle</text>
  <text x="823" y="186" font-size="14" fill="#15222E">• Explicación y registro</text>
  <text x="835" y="207" font-size="14" fill="#15222E">de cada decisión</text>

  <line x1="20" y1="280" x2="1060" y2="280" stroke="#C3CCD4" stroke-width="1.5"/>
  <text x="20" y="310" font-size="14" fill="#15222E"><tspan font-weight="700">Modelo de negocio:</tspan> licencia por puesto de operador, vendida al contratista que concursa por la gestión de la sala.</text>
</svg>
